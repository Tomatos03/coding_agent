<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" role="img" aria-labelledby="mcp-flow-title" font-family="'PingFang SC','Noto Sans SC','Microsoft YaHei',-apple-system,'Segoe UI',sans-serif">
  <title id="mcp-flow-title">MCP 模块组件与交互流程</title>
  <defs>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/>
    </marker>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="720" rx="12" fill="#ffffff"/>

  <text x="40" y="108" font-size="12" fill="#57606a">连接（启动时执行一次）</text>
  <text x="40" y="448" font-size="12" fill="#57606a">调用（ReAct 循环内，每次 tool_call）</text>

  <rect x="40" y="130" width="160" height="80" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="120" y="164" font-size="14" font-weight="700" text-anchor="middle" fill="#24292f" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">mcp.json</text>
  <text x="120" y="187" font-size="11" text-anchor="middle" fill="#57606a">server 配置（CWD）</text>

  <rect x="300" y="120" width="200" height="100" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="400" y="152" font-size="14" font-weight="700" text-anchor="middle" fill="#0550ae" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">connect_all()</text>
  <text x="400" y="176" font-size="11" text-anchor="middle" fill="#0550ae">逐 server 连接，失败隔离</text>
  <text x="400" y="198" font-size="11" text-anchor="middle" fill="#57606a">required=true 失败即报错</text>

  <rect x="570" y="80" width="330" height="250" rx="16" fill="none" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="592" y="106" font-size="13" fill="#57606a">McpConnection（1 server = 1 连接）</text>

  <rect x="600" y="122" width="270" height="64" rx="10" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="735" y="148" font-size="13" font-weight="700" text-anchor="middle" fill="#24292f">子进程（MCP Server）</text>
  <text x="735" y="170" font-size="11" text-anchor="middle" fill="#57606a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">stdio JSON-RPC 双向管道</text>

  <g font-size="11" fill="#57606a">
    <circle cx="620" cy="218" r="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="620" y="222" font-size="11" font-weight="700" text-anchor="middle" fill="#1a7f37">3</text>
    <text x="636" y="222">initialize 握手（超时 30s）</text>
    <circle cx="620" cy="244" r="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="620" y="248" font-size="11" font-weight="700" text-anchor="middle" fill="#1a7f37">4</text>
    <text x="636" y="248">tools/list 拉取工具快照（超时 30s）</text>
    <text x="636" y="274">stderr 转 tracing 日志（否则管道写满）</text>
    <text x="636" y="300">持有子进程句柄保活（kill_on_drop）</text>
  </g>

  <rect x="60" y="470" width="180" height="90" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="150" y="502" font-size="14" font-weight="700" text-anchor="middle" fill="#0550ae" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">ReactLoop</text>
  <text x="150" y="524" font-size="11" text-anchor="middle" fill="#0550ae">编排层</text>
  <text x="150" y="546" font-size="11" text-anchor="middle" fill="#57606a">（模型产出 tool_call）</text>

  <rect x="570" y="450" width="330" height="130" rx="10" fill="#ddf4ff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="735" y="482" font-size="14" font-weight="700" text-anchor="middle" fill="#0550ae" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">McpTool</text>
  <text x="735" y="506" font-size="11" text-anchor="middle" fill="#0550ae">远端工具 → 本地 Tool（trait 适配）</text>
  <text x="735" y="528" font-size="11" text-anchor="middle" fill="#57606a" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">暴露名 {server}__{tool}</text>
  <text x="735" y="550" font-size="11" text-anchor="middle" fill="#57606a">调用超时 = 该 server 的 timeoutSecs</text>

  <rect x="605" y="620" width="260" height="80" rx="10" fill="#dafbe1" stroke="#4ac26b" stroke-width="1.5"/>
  <text x="735" y="652" font-size="14" font-weight="700" text-anchor="middle" fill="#116329" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">Observation</text>
  <text x="735" y="676" font-size="11" text-anchor="middle" fill="#57606a">单条结果文本，回填进历史</text>

  <path d="M 200 170 H 300" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <path d="M 500 170 H 570" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <path d="M 640 330 V 450" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <path d="M 700 450 V 330" fill="none" stroke="#0969da" stroke-width="1.6" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <path d="M 240 515 H 570" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <path d="M 735 580 V 620" fill="none" stroke="#0969da" stroke-width="1.6" marker-end="url(#arr-blue)"/>

  <g font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="250" cy="170" r="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="250" y="174" fill="#1a7f37">1</text>
    <circle cx="535" cy="170" r="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="535" y="174" fill="#1a7f37">2</text>
    <circle cx="640" cy="360" r="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="640" y="364" fill="#1a7f37">5</text>
    <circle cx="405" cy="515" r="9" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
    <text x="405" y="519" fill="#0969da">6</text>
    <circle cx="700" cy="400" r="9" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
    <text x="700" y="404" fill="#0969da">7</text>
    <circle cx="735" cy="600" r="9" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/>
    <text x="735" y="604" fill="#0969da">8</text>
  </g>

  <text x="250" y="152" font-size="11" text-anchor="middle" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">load_config()</text>
  <text x="535" y="152" font-size="11" text-anchor="middle" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">connect()</text>
  <text x="624" y="364" font-size="11" text-anchor="end" fill="#1a7f37" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">tools_from_connection()</text>
  <text x="405" y="499" font-size="11" text-anchor="middle" fill="#0969da" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">execute(args)</text>
  <text x="712" y="404" font-size="11" fill="#0969da" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">tools/call（超时 = timeoutSecs）</text>
  <text x="747" y="604" font-size="11" fill="#0969da" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">render_call_result()</text>
</svg>
